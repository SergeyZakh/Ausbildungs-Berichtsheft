# Bei jedem Push und Pull Request: bauen und alle Browsertests laufen lassen.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Firefox für test/sicherung.js: Die Sicherung aus Chromium muss auch dort laden.
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - run: npm test

  server:
    # Server gegen Postgres (Docker ist auf den Runnern da), dazu der Browsertest mit Konto.
    # Der Betriebstest mit Keycloak (server/test/betrieb.sh) läuft vor einem Release von Hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npx playwright install --with-deps chromium
      - run: bash server/test/testen.sh
