# Anmeldeseite im Aussehen des Berichtshefts. Baut auf dem mitgelieferten keycloak.v2 auf und ändert
# nur Farben, Schrift und Texte; Abläufe und Vorlagen bleiben die von Keycloak, damit Updates nicht brechen.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/berichtsheft.css
# Macht aus dem Sprachmenü zwei Umschalter; ohne JavaScript bleibt das Menü.
scripts=js/sprache.js
# Das Werkzeug kennt nur ein helles Bild; eine dunkle Anmeldeseite davor wirkte fremd.
darkMode=false

locales=de,en
